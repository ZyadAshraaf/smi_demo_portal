<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Directory — Unified Workspace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/unifiedsmi/css/variables.css">
  <link rel="stylesheet" href="/unifiedsmi/theme.css">
  <link rel="stylesheet" href="/unifiedsmi/css/global.css">
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed-mode');</script>
  <link rel="stylesheet" href="/unifiedsmi/css/pages.css">
  <style>
    .emp-card { background: white; border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 22px 18px; text-align: center; box-shadow: var(--shadow-sm); transition: all 0.2s; cursor: pointer; }
    .emp-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); border-color: var(--color-primary); }
    .emp-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--color-primary); color: white; font-size: 24px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
    .emp-name  { font-size: 14px; font-weight: 700; color: var(--color-text); margin-bottom: 3px; }
    .emp-title { font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; }
    .emp-dept  { display: inline-block; background: var(--color-primary-faint); color: var(--color-primary); font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px; }
    .emp-contact { display: flex; justify-content: center; gap: 10px; margin-top: 12px; }
    .emp-contact a { width: 30px; height: 30px; border-radius: 50%; background: var(--color-surface); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; color: var(--color-text-muted); font-size: 14px; text-decoration: none; transition: all 0.15s; }
    .emp-contact a:hover { background: var(--color-primary); border-color: var(--color-primary); color: white; }
    .role-badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .5px; display: inline-block; margin-top: 4px; }
    .role-admin    { background: #FDE8EA; color: var(--color-danger); }
    .role-manager  { background: var(--color-info-light); color: var(--color-info); }
    .role-hr       { background: var(--color-warning-light); color: #92600A; }
    .role-employee { background: var(--color-success-light); color: var(--color-success); }
  </style>
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <img src="/unifiedsmi/assets/logo.png" alt="WIND-IS" class="sidebar-logo">
    </div>
        <nav class="sidebar-nav">
      <div class="nav-section">
        <a href="/unifiedsmi/" class="nav-item" data-page="landing"><i class="bi bi-house-door"></i><span>Home</span></a>
        <a href="/unifiedsmi/tasks" class="nav-item" data-page="tasks"><i class="bi bi-check2-square"></i><span>My Tasks</span><span class="nav-badge d-none" id="tasksBadge">0</span></a>
      </div>
      <div class="nav-section"><div class="nav-section-label">Services</div>
        <a href="/unifiedsmi/services" class="nav-item" data-page="services"><i class="bi bi-grid-3x3-gap"></i><span>Service Catalog</span></a>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar-sidebar" id="sidebarAvatar">A</div>
        <div class="sidebar-user-details">
          <div class="sidebar-user-name" id="sidebarUserName">Loading...</div>
          <div class="sidebar-user-role" id="sidebarUserRole">--</div>
        </div>
      </div>
      <a href="/unifiedsmi/api/auth/logout" class="sidebar-logout" title="Sign Out"><i class="bi bi-box-arrow-right"></i></a>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="main-wrapper">
    <header class="topbar">
      <button class="topbar-toggle" id="sidebarToggle"><i class="bi bi-list"></i></button>
      <img src="/unifiedsmi/assets/logo.png" alt="Logo" class="topbar-logo" id="topbarLogo">
      <h1 class="page-title">Organization Directory</h1>
      <div class="topbar-right">
        <div class="topbar-search"><i class="bi bi-search"></i><input type="text" placeholder="Search..."></div>
        <button class="icon-btn"><i class="bi bi-bell"></i><span class="notif-dot d-none" id="notifDot"></span></button>
        <div class="dropdown">
          <div class="topbar-user" data-bs-toggle="dropdown">
            <div class="user-avatar-sm" id="topbarAvatar">A</div>
            <span class="topbar-user-name" id="topbarUserName">User</span>
            <i class="bi bi-chevron-down fs-xs text-muted ms-1"></i>
          </div>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm">
            <li><a class="dropdown-item" href="/unifiedsmi/api/auth/logout"><i class="bi bi-box-arrow-right me-2 text-danger"></i>Sign Out</a></li>
          </ul>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="page-hero">
        <div class="page-hero-bc">Dashboard &rsaquo; <span>Directory</span></div>
        <div class="page-hero-title"><i class="bi bi-people me-2"></i>Organization Directory</div>
        <div class="page-hero-sub">Find colleagues, view profiles and get in touch.</div>
      </div>
      <!-- Search & Filter -->
      <div class="card mb-4">
        <div class="card-body py-3">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-6">
              <div class="topbar-search" style="max-width:100%">
                <i class="bi bi-search"></i>
                <input type="text" id="dirSearch" placeholder="Search by name, title, or email..." style="width:100%">
              </div>
            </div>
            <div class="col-6 col-md-3">
              <select class="form-select" id="dirDeptFilter">
                <option value="">All Departments</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <div class="fs-sm text-muted" id="dirCount">Showing all employees</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Employee Grid -->
      <div class="row g-3" id="directoryGrid">
        <div class="col-12 text-center py-5"><div class="spinner-border" style="color:var(--color-primary)"></div></div>
      </div>
    </main>
  </div>
</div>

<!-- Employee Profile Modal -->
<div class="modal fade" id="empProfileModal" tabindex="-1">
  <div class="modal-dialog modal-md">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-circle me-2"></i>Employee Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="empProfileBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/unifiedsmi/js/api.js"></script>
<script src="/unifiedsmi/js/directory.js"></script>
</body>
</html>
